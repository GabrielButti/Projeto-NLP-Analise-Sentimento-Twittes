version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nlp_api
    ports:
      - "8000:8000"
    networks:
      - nlpnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: nlp_ui
    ports:
      - "8501:8501"
    environment: 
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - nlpnet

networks:
  nlpnet:
    driver: bridge
